<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PIXEL WORLD – Maya &amp; Ciell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ui-bg: rgba(10, 16, 34, 0.48);
      --ui-border: rgba(255, 255, 255, 0.14);
      --ui-hover: rgba(255, 255, 255, 0.14);
      --text-main: rgba(246, 243, 238, 0.94);
      --text-soft: rgba(220, 224, 240, 0.78);
      --accent-glow: rgba(255, 214, 153, 0.45);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #040713;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #world-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #040713;
      cursor: crosshair;
    }

    .scene-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    #pixelBgCanvas {
      z-index: 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #fireworksCanvas {
      z-index: 2;
    }

    #pixelFgCanvas {
      z-index: 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Subtle atmospheric vignette */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 45%,
        transparent 55%,
        rgba(3, 6, 18, 0.36) 85%,
        rgba(2, 4, 12, 0.65) 100%
      );
    }

    /* Intro fade-in curtain */
    #introCurtain {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 50%, #091024 0%, #03050e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 2.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #introCurtain.fade-out {
      opacity: 0;
    }

    .intro-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.3rem, 3.2vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(246, 240, 230, 0.9);
      text-shadow: 0 0 24px rgba(170, 200, 255, 0.35);
      animation: introPulse 2.2s ease-in-out infinite alternate;
      text-align: center;
      padding: 0 20px;
    }

    .intro-sub {
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      letter-spacing: 0.22em;
      color: rgba(190, 205, 235, 0.65);
      text-transform: uppercase;
    }

    @keyframes introPulse {
      from { opacity: 0.55; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* UI Layer */
    #uiLayer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        calc(14px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(14px + var(--safe-bottom))
        calc(16px + var(--safe-left));
      transition: opacity 0.6s ease;
    }

    #uiLayer.ui-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-soft);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd99b;
      box-shadow: 0 0 8px #ffd99b;
      animation: pulseDot 2.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .controls-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ui-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .ui-pill:hover {
      background: var(--ui-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .ui-pill:active {
      transform: scale(0.96);
    }

    .ui-pill.active {
      border-color: rgba(255, 217, 155, 0.48);
      box-shadow: 0 0 16px rgba(255, 217, 155, 0.18);
    }

    .ui-pill svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .volume-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 68px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffe3b3;
      box-shadow: 0 0 8px rgba(255, 227, 179, 0.65);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    .volume-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: #ffe3b3;
      box-shadow: 0 0 8px rgba(255, 227, 179, 0.65);
      cursor: pointer;
    }

    /* Subtle interactive hint */
    .tap-hint {
      position: fixed;
      top: calc(66px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      pointer-events: none;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 16, 34, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(235, 238, 248, 0.78);
      opacity: 0;
      transition: opacity 0.9s ease;
      white-space: nowrap;
    }

    .tap-hint.visible {
      opacity: 1;
    }

    /* Romantic bottom caption */
    .bottom-caption {
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding-bottom: 4px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 2.2s ease, transform 2.2s ease;
    }

    .bottom-caption.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quote-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.38rem);
      letter-spacing: 0.06em;
      color: rgba(250, 246, 240, 0.92);
      text-shadow:
        0 2px 12px rgba(2, 5, 15, 0.9),
        0 0 24px rgba(150, 185, 255, 0.22);
      line-height: 1.35;
    }

    .names-text {
      margin-top: 4px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(0.84rem, 1.9vw, 1.05rem);
      letter-spacing: 0.24em;
      color: rgba(255, 224, 186, 0.92);
      text-shadow:
        0 2px 10px rgba(2, 5, 15, 0.95),
        0 0 18px rgba(255, 200, 140, 0.28);
    }

    /* Restore UI floating button when UI is hidden */
    #restoreUiBtn {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: calc(16px + var(--safe-right));
      z-index: 15;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(10, 16, 34, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.72);
      font-family: inherit;
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, background 0.25s ease;
    }

    #restoreUiBtn.visible {
      opacity: 0.36;
      pointer-events: auto;
    }

    #restoreUiBtn.visible:hover,
    #restoreUiBtn.visible:active {
      opacity: 0.95;
      background: rgba(10, 16, 34, 0.72);
    }

    #restoreUiBtn svg {
      width: 14px;
      height: 14px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .brand-badge {
        display: none;
      }

      .top-bar {
        justify-content: center;
      }

      .controls-group {
        justify-content: center;
        gap: 6px;
      }

      .ui-pill {
        height: 40px;
        padding: 0 12px;
        font-size: 0.75rem;
      }

      .ui-pill .btn-label {
        display: inline;
      }

      .volume-wrap {
        height: 40px;
        padding: 0 10px;
      }

      .volume-slider {
        width: 56px;
      }

      .tap-hint {
        top: calc(108px + var(--safe-top));
        font-size: 0.68rem;
      }
    }

    @media (max-width: 440px) {
      .ui-pill {
        padding: 0 10px;
        font-size: 0.72rem;
      }
      .ui-pill .hide-xs {
        display: none;
      }
      .volume-slider {
        width: 48px;
      }
    }
  </style>
</head>
<body>
  <div id="world-stage" aria-label="Pixel World – Maya & Ciell interactive night beach">
    <canvas id="pixelBgCanvas" class="scene-canvas"></canvas>
    <canvas id="fireworksCanvas" class="scene-canvas"></canvas>
    <canvas id="pixelFgCanvas" class="scene-canvas"></canvas>
    <div class="vignette"></div>
  </div>

  <!-- Intro Curtain -->
  <div id="introCurtain">
    <div class="intro-title">Pixel World</div>
    <div class="intro-sub">Maya &amp; Ciell</div>
  </div>

  <!-- Subtle Hint -->
  <div id="tapHint" class="tap-hint">Tap the sky for fireworks &bull; Toggle music anytime</div>

  <!-- Main UI -->
  <div id="uiLayer">
    <header class="top-bar">
      <div class="brand-badge">
        <span class="brand-dot"></span>
        <span>Pixel World &bull; Night Beach</span>
      </div>

      <div class="controls-group">
        <button id="musicBtn" class="ui-pill" type="button" aria-label="Toggle music and sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span id="musicBtnLabel" class="btn-label">Music: OFF</span>
        </button>

        <div class="volume-wrap" title="Volume">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="65" aria-label="Volume" />
        </div>

        <button id="replayBtn" class="ui-pill" type="button" aria-label="Replay scene">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span class="btn-label hide-xs">Replay</span>
        </button>

        <button id="fullscreenBtn" class="ui-pill" type="button" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span class="btn-label hide-xs">Fullscreen</span>
        </button>

        <button id="hideUiBtn" class="ui-pill" type="button" aria-label="Hide interface">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <span class="btn-label hide-xs">Hide UI</span>
        </button>
      </div>
    </header>

    <div></div>

    <footer id="bottomCaption" class="bottom-caption">
      <p class="quote-text">&ldquo;Under the same sky, beside the same sea.&rdquo;</p>
      <p class="names-text">Maya &#9825; Ciell</p>
    </footer>
  </div>

  <!-- Restore UI Button -->
  <button id="restoreUiBtn" type="button" aria-label="Show UI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <span>Show UI</span>
  </button>

  <script>
    (() => {
      'use strict';

      /* =========================================================================
       * 1. DOM ELEMENTS & STATE
       * ========================================================================= */
      const stage = document.getElementById('world-stage');
      const bgCanvas = document.getElementById('pixelBgCanvas');
      const fxCanvas = document.getElementById('fireworksCanvas');
      const fgCanvas = document.getElementById('pixelFgCanvas');

      const bgCtx = bgCanvas.getContext('2d', { alpha: false });
      const fxCtx = fxCanvas.getContext('2d', { alpha: true });
      const fgCtx = fgCanvas.getContext('2d', { alpha: true });

      // Offscreen pixel buffers for crisp zero-shimmer pixel scaling
      const bgOff = document.createElement('canvas');
      const fgOff = document.createElement('canvas');
      const bgOffCtx = bgOff.getContext('2d', { alpha: false });
      const fgOffCtx = fgOff.getContext('2d', { alpha: true });

      // Offscreen canvas for sampling text firework shapes ("MAYA", "I LOVE YOU")
      const textSampleCanvas = document.createElement('canvas');
      const textSampleCtx = textSampleCanvas.getContext('2d', { willReadFrequently: true });

      const introCurtain = document.getElementById('introCurtain');
      const tapHint = document.getElementById('tapHint');
      const bottomCaption = document.getElementById('bottomCaption');
      const uiLayer = document.getElementById('uiLayer');
      const restoreUiBtn = document.getElementById('restoreUiBtn');

      const musicBtn = document.getElementById('musicBtn');
      const musicBtnLabel = document.getElementById('musicBtnLabel');
      const volumeSlider = document.getElementById('volumeSlider');
      const replayBtn = document.getElementById('replayBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const hideUiBtn = document.getElementById('hideUiBtn');

      const state = {
        width: window.innerWidth,
        height: window.innerHeight,
        dpr: 1,
        isPortrait: window.innerHeight > window.innerWidth,
        isMobile: window.innerWidth <= 768,
        qualityTier: 'high', // 'high' | 'medium' | 'low'
        maxParticles: 1750,
        particleScale: 1,

        // Pixel grid layout metrics
        px: 3,
        gridW: 320,
        gridH: 180,
        horizonRow: 100,
        shoreRow: 136,
        horizonY: 300,
        shoreY: 408,

        // Timing
        time: 0,
        lastFrame: performance.now(),
        fpsAccumulator: 0,
        fpsFrames: 0,
        autoFireworkTimer: 1.4,
        burstCounter: 0,
        specialCooldown: 2,
        finaleCooldown: 14,
        ambientFlash: { r: 0, g: 0, b: 0, intensity: 0, x: 0.5 },

        // UI State
        uiHidden: false,
        audioEnabled: false,
        volume: 0.65
      };

      /* =========================================================================
       * 2. AUDIO ENGINE (Web Audio API: Waves, Night Wind, Piano, Fireworks)
       * ========================================================================= */
      class RomanticAudioEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.musicGain = null;
          this.sfxGain = null;
          this.reverbNode = null;
          this.noiseBuffer = null;
          this.isPlaying = false;
          this.pianoInterval = null;
          this.stepIndex = 0;

          // Romantic nocturnal chord progression (Fmaj7 - Dm9 - Bbmaj7 - C6sus4)
          this.progression = [
            { bass: 174.61, notes: [261.63, 329.63, 349.23, 440.00, 523.25] }, // Fmaj7
            { bass: 146.83, notes: [261.63, 329.63, 349.23, 440.00, 659.25] }, // Dm9
            { bass: 116.54, notes: [233.08, 293.66, 349.23, 440.00, 587.33] }, // Bbmaj7
            { bass: 130.81, notes: [261.63, 293.66, 392.00, 440.00, 523.25] }  // C6sus2
          ];
          this.melodyPool = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00];
        }

        init() {
          if (this.ctx) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.0001;
          this.masterGain.connect(this.ctx.destination);

          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 0.55;
          this.musicGain.connect(this.masterGain);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.value = 0.72;
          this.sfxGain.connect(this.masterGain);

          this.createNoiseBuffer();
          this.createReverb();
          this.startOceanAndWind();
        }

        createNoiseBuffer() {
          const sampleRate = this.ctx.sampleRate;
          const length = sampleRate * 4;
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.028 * white) / 1.028;
            lastOut = data[i];
            data[i] *= 2.8;
          }
          this.noiseBuffer = buffer;
        }

        createReverb() {
          const sampleRate = this.ctx.sampleRate;
          const length = sampleRate * 2.8;
          const impulse = this.ctx.createBuffer(2, length, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const data = impulse.getChannelData(ch);
            for (let i = 0; i < length; i++) {
              const decay = Math.pow(1 - i / length, 2.7);
              data[i] = (Math.random() * 2 - 1) * decay;
            }
          }
          this.reverbNode = this.ctx.createConvolver();
          this.reverbNode.buffer = impulse;

          const reverbWet = this.ctx.createGain();
          reverbWet.gain.value = 0.42;
          this.reverbNode.connect(reverbWet);
          reverbWet.connect(this.musicGain);
        }

        startOceanAndWind() {
          const waveSrc = this.ctx.createBufferSource();
          waveSrc.buffer = this.noiseBuffer;
          waveSrc.loop = true;

          const waveFilter = this.ctx.createBiquadFilter();
          waveFilter.type = 'lowpass';
          waveFilter.frequency.value = 340;
          waveFilter.Q.value = 0.7;

          const waveGain = this.ctx.createGain();
          waveGain.gain.value = 0.16;

          const waveLfo = this.ctx.createOscillator();
          waveLfo.frequency.value = 0.12;
          const waveLfoAmp = this.ctx.createGain();
          waveLfoAmp.gain.value = 210;
          waveLfo.connect(waveLfoAmp);
          waveLfoAmp.connect(waveFilter.frequency);

          const waveAmpLfo = this.ctx.createGain();
          waveAmpLfo.gain.value = 0.11;
          waveLfo.connect(waveAmpLfo);
          waveAmpLfo.connect(waveGain.gain);

          waveSrc.connect(waveFilter);
          waveFilter.connect(waveGain);
          waveGain.connect(this.masterGain);

          waveSrc.start();
          waveLfo.start();

          const windSrc = this.ctx.createBufferSource();
          windSrc.buffer = this.noiseBuffer;
          windSrc.loop = true;

          const windFilter = this.ctx.createBiquadFilter();
          windFilter.type = 'bandpass';
          windFilter.frequency.value = 520;
          windFilter.Q.value = 1.6;

          const windGain = this.ctx.createGain();
          windGain.gain.value = 0.045;

          const windLfo = this.ctx.createOscillator();
          windLfo.frequency.value = 0.07;
          const windLfoAmp = this.ctx.createGain();
          windLfoAmp.gain.value = 160;
          windLfo.connect(windLfoAmp);
          windLfoAmp.connect(windFilter.frequency);

          windSrc.connect(windFilter);
          windFilter.connect(windGain);
          windGain.connect(this.masterGain);

          windSrc.start();
          windLfo.start();
        }

        playPianoNote(freq, velocity = 0.15, duration = 3.2) {
          if (!this.ctx || !this.isPlaying) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          osc1.type = 'triangle';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(Math.min(2200, freq * 3.4), now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 1.1), now + duration * 0.8);

          const env = this.ctx.createGain();
          env.gain.setValueAtTime(0.0001, now);
          env.gain.linearRampToValueAtTime(velocity, now + 0.03);
          env.gain.exponentialRampToValueAtTime(velocity * 0.35, now + 0.55);
          env.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          const overtoneGain = this.ctx.createGain();
          overtoneGain.gain.value = 0.18;

          osc1.connect(filter);
          osc2.connect(overtoneGain);
          overtoneGain.connect(filter);
          filter.connect(env);

          env.connect(this.musicGain);
          if (this.reverbNode) env.connect(this.reverbNode);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration + 0.05);
          osc2.stop(now + duration + 0.05);
        }

        startPianoLoop() {
          if (this.pianoInterval) return;
          const playStep = () => {
            if (!this.isPlaying || !this.ctx) return;
            const chordIdx = Math.floor(this.stepIndex / 8) % this.progression.length;
            const beatInBar = this.stepIndex % 8;
            const chord = this.progression[chordIdx];

            if (beatInBar === 0) {
              this.playPianoNote(chord.bass, 0.16, 4.4);
              this.playPianoNote(chord.notes[0], 0.10, 3.6);
            } else if (beatInBar === 2) {
              this.playPianoNote(chord.notes[1], 0.09, 3.0);
            } else if (beatInBar === 3) {
              this.playPianoNote(chord.notes[2], 0.10, 3.2);
            } else if (beatInBar === 5) {
              this.playPianoNote(chord.notes[3], 0.085, 2.8);
            } else if (beatInBar === 6 && Math.random() < 0.72) {
              const highNote = chord.notes[4] || this.melodyPool[Math.floor(Math.random() * this.melodyPool.length)];
              this.playPianoNote(highNote, 0.08, 3.4);
            } else if (beatInBar === 7 && Math.random() < 0.38) {
              const mel = this.melodyPool[Math.floor(Math.random() * this.melodyPool.length)];
              this.playPianoNote(mel, 0.065, 2.8);
            }
            this.stepIndex++;
          };

          playStep();
          this.pianoInterval = setInterval(playStep, 760);
        }

        stopPianoLoop() {
          if (this.pianoInterval) {
            clearInterval(this.pianoInterval);
            this.pianoInterval = null;
          }
        }

        setEnabled(enabled) {
          if (enabled) {
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            this.isPlaying = true;
            const now = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(now);
            this.masterGain.gain.setTargetAtTime(Math.max(0.001, state.volume), now, 0.35);
            this.startPianoLoop();
          } else {
            this.isPlaying = false;
            this.stopPianoLoop();
            if (this.ctx && this.masterGain) {
              const now = this.ctx.currentTime;
              this.masterGain.gain.cancelScheduledValues(now);
              this.masterGain.gain.setTargetAtTime(0.0001, now, 0.25);
            }
          }
        }

        setVolume(val) {
          state.volume = val;
          if (this.ctx && this.masterGain && this.isPlaying) {
            this.masterGain.gain.setTargetAtTime(Math.max(0.0001, val), this.ctx.currentTime, 0.08);
          }
        }

        playRocketLaunch(xNorm) {
          if (!this.ctx || !this.isPlaying || !this.noiseBuffer) return;
          const now = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(750, now);
          filter.frequency.exponentialRampToValueAtTime(1900, now + 0.45);
          filter.Q.value = 3.2;

          const env = this.ctx.createGain();
          env.gain.setValueAtTime(0.0001, now);
          env.gain.linearRampToValueAtTime(0.04, now + 0.06);
          env.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

          const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
          src.connect(filter);
          filter.connect(env);
          if (panner) {
            panner.pan.value = Math.max(-0.85, Math.min(0.85, (xNorm - 0.5) * 1.6));
            env.connect(panner);
            panner.connect(this.sfxGain);
          } else {
            env.connect(this.sfxGain);
          }

          src.start(now);
          src.stop(now + 0.6);
        }

        playFireworkExplosion(xNorm, scale = 1, hasCrackle = false) {
          if (!this.ctx || !this.isPlaying || !this.noiseBuffer) return;
          const now = this.ctx.currentTime;
          const panVal = Math.max(-0.85, Math.min(0.85, (xNorm - 0.5) * 1.6));
          const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
          if (panner) {
            panner.pan.value = panVal;
            panner.connect(this.sfxGain);
          }
          const dest = panner || this.sfxGain;

          const sub = this.ctx.createOscillator();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(105, now);
          sub.frequency.exponentialRampToValueAtTime(34, now + 0.35);
          const subEnv = this.ctx.createGain();
          subEnv.gain.setValueAtTime(0.24 * scale, now);
          subEnv.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          sub.connect(subEnv);
          subEnv.connect(dest);
          sub.start(now);
          sub.stop(now + 0.45);

          const burst = this.ctx.createBufferSource();
          burst.buffer = this.noiseBuffer;
          const lpf = this.ctx.createBiquadFilter();
          lpf.type = 'lowpass';
          lpf.frequency.setValueAtTime(1400, now);
          lpf.frequency.exponentialRampToValueAtTime(180, now + 1.15);

          const burstEnv = this.ctx.createGain();
          burstEnv.gain.setValueAtTime(0.001, now);
          burstEnv.gain.linearRampToValueAtTime(0.32 * scale, now + 0.025);
          burstEnv.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);

          burst.connect(lpf);
          lpf.connect(burstEnv);
          burstEnv.connect(dest);
          burst.start(now);
          burst.stop(now + 1.3);

          if (hasCrackle) {
            const count = 4;
            for (let i = 0; i < count; i++) {
              const t = now + 0.45 + Math.random() * 0.7;
              const cSrc = this.ctx.createBufferSource();
              cSrc.buffer = this.noiseBuffer;
              const hpf = this.ctx.createBiquadFilter();
              hpf.type = 'highpass';
              hpf.frequency.value = 2400;
              const cEnv = this.ctx.createGain();
              cEnv.gain.setValueAtTime(0.0001, t);
              cEnv.gain.linearRampToValueAtTime(0.055 * scale, t + 0.01);
              cEnv.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
              cSrc.connect(hpf);
              hpf.connect(cEnv);
              cEnv.connect(dest);
              cSrc.start(t);
              cSrc.stop(t + 0.09);
            }
          }
        }
      }
