      // Sample crisp coordinates for text fireworks ("MAYA", "I LOVE YOU")
      function sampleTextPoints(lines, maxTargetWidth, fontSize) {
        const w = Math.ceil(maxTargetWidth + 40);
        const lineHeight = fontSize * 1.18;
        const h = Math.ceil(lines.length * lineHeight + 36);

        textSampleCanvas.width = w;
        textSampleCanvas.height = h;
        const ctx = textSampleCtx;
        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${fontSize}px "Plus Jakarta Sans", "Arial", sans-serif`;

        const totalTextH = (lines.length - 1) * lineHeight;
        for (let i = 0; i < lines.length; i++) {
          const ly = h / 2 - totalTextH / 2 + i * lineHeight;
          ctx.fillText(lines[i], w / 2, ly);
        }

        const imgData = ctx.getImageData(0, 0, w, h).data;
        const rawPoints = [];
        // Dynamic sampling stride so letters stay sharp without particle overload
        const step = state.qualityTier === 'low' ? 4 : 3;

        for (let py = 0; py < h; py += step) {
          for (let px = 0; px < w; px += step) {
            const alpha = imgData[(py * w + px) * 4 + 3];
            if (alpha > 135) {
              rawPoints.push({
                dx: px - w / 2,
                dy: py - h / 2
              });
            }
          }
        }

        // Cap maximum points cleanly while keeping uniform shape distribution
        const maxPoints = state.qualityTier === 'low' ? 230 : (state.isMobile ? 310 : 440);
        if (rawPoints.length > maxPoints) {
          const stride = rawPoints.length / maxPoints;
          const sampled = [];
          for (let i = 0; i < maxPoints; i++) {
            sampled.push(rawPoints[Math.floor(i * stride)]);
          }
          return sampled;
        }
        return rawPoints;
      }

      class Rocket {
        constructor(targetX, targetY, type = null, scale = 1) {
          this.startX = targetX + (Math.random() - 0.5) * Math.min(110, state.width * 0.14);
          this.startY = state.horizonY + 10;
          this.x = this.startX;
          this.y = this.startY;
          this.targetX = targetX;
          this.targetY = Math.min(state.horizonY - 45, Math.max(state.height * 0.08, targetY));

          const dx = this.targetX - this.startX;
          const dy = this.targetY - this.startY;
          const flightTime = 0.72 + Math.random() * 0.28;
          this.gravity = 240;
          this.vx = dx / flightTime;
          this.vy = (dy - 0.5 * this.gravity * flightTime * flightTime) / flightTime;

          this.type = type || FIREWORK_TYPES[Math.floor(Math.random() * FIREWORK_TYPES.length)];
          this.scale = scale;
          this.palette = getPaletteForType(this.type);
          this.color = this.palette[0];
          this.trail = [];
          this.smokeTimer = 0;
          this.exploded = false;

          audio.playRocketLaunch(this.startX / state.width);
        }

        update(dt) {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 10) this.trail.shift();

          this.vy += this.gravity * dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;

          this.smokeTimer += dt;
          if (this.smokeTimer > 0.045) {
            this.smokeTimer = 0;
            if (smokes.length < 90) {
              smokes.push(new SmokePuff(this.x, this.y, 4 + Math.random() * 5, 0.12, this.color));
            }
          }

          if (this.vy >= -25 || this.y <= this.targetY) {
            this.exploded = true;
            explodeFirework(this.x, this.y, this.type, this.palette, this.scale);
          }
        }

        draw(ctx) {
          if (this.trail.length > 1) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 1; i < this.trail.length; i++) {
              const alpha = (i / this.trail.length) * 0.7;
              ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`;
              ctx.lineWidth = (i / this.trail.length) * 2.6;
              ctx.beginPath();
              ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);
              ctx.lineTo(this.trail[i].x, this.trail[i].y);
              ctx.stroke();
            }
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.85)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      class Particle {
        constructor(x, y, vx, vy, color, options = {}) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.gravity = options.gravity ?? 78;
          this.drag = options.drag ?? 0.982;
          this.life = 0;
          this.maxLife = options.maxLife ?? (1.6 + Math.random() * 1.1);
          this.size = options.size ?? (1.6 + Math.random() * 1.4);
          this.trailLen = options.trailLen ?? 7;
          this.trail = [{ x, y }];
          this.twinkle = options.twinkle ?? false;
          this.crackle = options.crackle ?? false;
          this.crackleDone = false;
          this.brightness = options.brightness ?? 1;
          this.isFormation = options.isFormation ?? false;
        }

        update(dt) {
          this.life += dt;
          const dragFactor = Math.pow(this.drag, dt * 60);
          this.vx *= dragFactor;
          this.vy *= dragFactor;
          this.vy += this.gravity * dt;

          // Keep text & heart formations sharp without side smear
          if (!this.isFormation) {
            this.vx += 4.5 * dt;
          }

          this.x += this.vx * dt;
          this.y += this.vy * dt;

          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLen) {
            this.trail.shift();
          }

          if (this.crackle && !this.crackleDone && this.life > this.maxLife * 0.65) {
            this.crackleDone = true;
            this.size *= 1.6;
          }
        }

        get alpha() {
          const progress = this.life / this.maxLife;
          if (progress >= 1) return 0;
          let a = this.isFormation
            ? (progress < 0.72 ? 1 : 1 - Math.pow((progress - 0.72) / 0.28, 1.5))
            : (1 - Math.pow(progress, 1.75));
          if (this.twinkle && progress > 0.35) {
            a *= 0.55 + 0.45 * Math.sin(this.life * 24 + this.x);
          }
          return Math.max(0, a * this.brightness);
        }

        draw(ctx) {
          const a = this.alpha;
          if (a <= 0.01) return;

          const { r, g, b } = this.color;

          if (this.trail.length > 1) {
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${(a * (this.isFormation ? 0.45 : 0.65)).toFixed(3)})`;
            ctx.lineWidth = this.size * 0.9;
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
              ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.stroke();
          }

          if (a > 0.18) {
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${(a * 0.24).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2.7, 0, Math.PI * 2);
            ctx.fill();
          }

          const coreMix = Math.max(0, 1 - (this.life / this.maxLife) * 2.2);
          const cr = Math.round(r + (255 - r) * coreMix);
          const cg = Math.round(g + (255 - g) * coreMix);
          const cb = Math.round(b + (255 - b) * coreMix);

          ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${a.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      class SmokePuff {
        constructor(x, y, radius, alpha, tint) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.alpha = alpha;
          this.tint = tint;
          this.vx = 5 + Math.random() * 8;
          this.vy = -4 - Math.random() * 6;
          this.life = 0;
          this.maxLife = 1.9 + Math.random() * 1.4;
        }

        update(dt) {
          this.life += dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.radius += 11 * dt;
        }

        draw(ctx) {
          const p = this.life / this.maxLife;
          if (p >= 1) return;
          const a = this.alpha * (1 - p);
          const r = Math.round(90 + this.tint.r * 0.35);
          const g = Math.round(98 + this.tint.g * 0.35);
          const b = Math.round(115 + this.tint.b * 0.35);

          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`);
          grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function addParticleSafe(p, forceFormation = false) {
        if (forceFormation || particles.length < state.maxParticles) {
          particles.push(p);
        }
      }

      function spawnFormationBurst(x, y, offsets, palette, options = {}) {
        // Exact exponential drag expansion coefficient so particles bloom from (x, y) into sharp positions
        const drag = 0.905;
        const k = -Math.log(drag) * 60; // ~5.99 s^-1
        const maxLife = options.maxLife ?? 3.1;
        const gravity = options.gravity ?? 12;
        const size = options.size ?? (state.isMobile ? 1.55 : 1.8);

        for (let i = 0; i < offsets.length; i++) {
          const pt = offsets[i];
          const jitterX = (Math.random() - 0.5) * 2.0;
          const jitterY = (Math.random() - 0.5) * 2.0;
          const vx = (pt.dx + jitterX) * k;
          const vy = (pt.dy + jitterY) * k;
          const col = palette[i % palette.length];

          addParticleSafe(new Particle(x, y, vx, vy, col, {
            gravity,
            drag,
            maxLife: maxLife + Math.random() * 0.45,
            trailLen: 4,
            size,
            twinkle: true,
            isFormation: true,
            brightness: 1.08
          }), true);
        }
      }

      function explodeFirework(x, y, type, palette, scale = 1) {
        const pScale = state.particleScale * scale;
        const speedBase = Math.min(state.width, state.height) * 0.25 * scale;
        const primary = palette[0];

        state.ambientFlash.r = primary.r;
        state.ambientFlash.g = primary.g;
        state.ambientFlash.b = primary.b;
        state.ambientFlash.intensity = Math.min(1, 0.55 * scale);
        state.ambientFlash.x = x / state.width;

        const hasCrackle = type === 'golden_chrysanthemum' || type === 'cascading';
        audio.playFireworkExplosion(x / state.width, Math.min(1.25, scale), hasCrackle);

        const smokeCount = state.qualityTier === 'low' ? 3 : 6;
        for (let i = 0; i < smokeCount; i++) {
          if (smokes.length < 95) {
            smokes.push(new SmokePuff(
              x + (Math.random() - 0.5) * 28,
              y + (Math.random() - 0.5) * 28,
              16 + Math.random() * 18,
              0.11,
              primary
            ));
          }
        }

        if (type === 'heart') {
          // Parametric heart explosion
          const count = Math.round(165 * Math.max(0.75, pScale));
          const heartRadius = Math.min(state.width, state.height) * (state.isMobile ? 0.14 : 0.13) * scale;
          const scaleUnit = heartRadius / 16;
          const heartPoints = [];

          for (let i = 0; i < count; i++) {
            const theta = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(theta), 3);
            const hy = -(13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta));
            heartPoints.push({
              dx: hx * scaleUnit,
              dy: hy * scaleUnit
            });
          }

          // Inner soft heart glow ring
          const innerCount = Math.round(55 * Math.max(0.75, pScale));
          for (let i = 0; i < innerCount; i++) {
            const theta = (i / innerCount) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(theta), 3);
            const hy = -(13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta));
            heartPoints.push({
              dx: hx * scaleUnit * 0.62,
              dy: hy * scaleUnit * 0.62
            });
          }

          spawnFormationBurst(x, y, heartPoints, palette, {
            maxLife: 2.6,
            gravity: 15,
            size: state.isMobile ? 1.6 : 1.9
          });
          return;
        }

        if (type === 'text_maya') {
          const maxW = Math.min(state.width * 0.62, 340);
          const fontSize = Math.max(38, Math.min(68, Math.floor(maxW / 3.9)));
          const pts = sampleTextPoints(['MAYA'], maxW, fontSize);
          // Clamp center X so text never clips on screen edges
          const safeX = Math.max(maxW * 0.52, Math.min(state.width - maxW * 0.52, x));
          spawnFormationBurst(safeX, y, pts, palette, {
            maxLife: 3.0,
            gravity: 11,
            size: state.isMobile ? 1.55 : 1.85
          });
          return;
        }

        if (type === 'text_iloveyou') {
          const isNarrow = state.width < 580;
          const lines = isNarrow ? ['I LOVE', 'YOU'] : ['I LOVE YOU'];
          const maxW = Math.min(state.width * 0.84, 640);
          const fontSize = isNarrow
            ? Math.max(34, Math.min(54, Math.floor(maxW / 4.8)))
            : Math.max(42, Math.min(72, Math.floor(maxW / 7.2)));

          const pts = sampleTextPoints(lines, maxW, fontSize);
          const safeX = state.width * 0.5;
          const safeY = Math.min(state.horizonY * 0.52, Math.max(state.height * 0.22, y));

          spawnFormationBurst(safeX, safeY, pts, palette, {
            maxLife: 4.0,
            gravity: 8,
            size: state.isMobile ? 1.65 : 2.0
          });

          // Celebratory delicate golden sparkles framing "I LOVE YOU"
          const haloCount = Math.round(70 * pScale);
          for (let i = 0; i < haloCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.95 + Math.random() * 0.45);
            addParticleSafe(new Particle(safeX, safeY, Math.cos(angle) * speed, Math.sin(angle) * speed * 0.58, palette[i % palette.length], {
              gravity: 48,
              drag: 0.976,
              maxLife: 2.2 + Math.random() * 0.9,
              trailLen: 6,
              size: 1.5,
              twinkle: true
            }));
          }
          return;
        }

        if (type === 'golden_chrysanthemum') {
          const count = Math.round(220 * pScale);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.45 + Math.random() * 0.65);
            const col = palette[i % palette.length];
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, col, {
              gravity: 75,
              drag: 0.981,
              maxLife: 2.0 + Math.random() * 0.9,
              trailLen: 10,
              size: 1.4 + Math.random() * 1.1,
              crackle: Math.random() > 0.55,
              twinkle: true
            }));
          }
        } else if (type === 'blue_peony' || type === 'red_firework' || type === 'purple_firework') {
          const count = Math.round(190 * pScale);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radFactor = Math.pow(Math.random(), 0.45);
            const speed = speedBase * (0.35 + radFactor * 0.68);
            const col = palette[Math.floor(Math.random() * palette.length)];
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, col, {
              gravity: 68,
              drag: 0.978,
              maxLife: 1.5 + Math.random() * 0.9,
              trailLen: 5,
              size: 1.8 + Math.random() * 1.4,
              twinkle: type === 'purple_firework' && Math.random() > 0.5
            }));
          }
          const coreCount = Math.round(45 * pScale);
          for (let i = 0; i < coreCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * 0.25 * Math.random();
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, palette[2] || primary, {
              gravity: 48,
              drag: 0.975,
              maxLife: 1.1 + Math.random() * 0.6,
              trailLen: 4,
              size: 1.4
            }));
          }
        } else if (type === 'willow') {
          const count = Math.round(170 * pScale);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.35 + Math.random() * 0.6);
            const col = palette[i % palette.length];
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, col, {
              gravity: 112,
              drag: 0.972,
              maxLife: 2.8 + Math.random() * 1.2,
              trailLen: 14,
              size: 1.4 + Math.random() * 0.9,
              twinkle: true
            }));
          }
        } else if (type === 'multicolor') {
          const count = Math.round(230 * pScale);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.28 + Math.random() * 0.78);
            const col = palette[Math.floor(Math.random() * palette.length)];
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, col, {
              gravity: 74,
              drag: 0.98,
              maxLife: 1.7 + Math.random() * 0.9,
              trailLen: 7,
              size: 1.6 + Math.random() * 1.3,
              twinkle: Math.random() > 0.65
            }));
          }
        } else if (type === 'ring') {
          const count = Math.round(130 * pScale);
          const tiltX = (Math.random() - 0.5) * 1.1;
          const tiltZ = (Math.random() - 0.5) * 0.9;
          const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
          const cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);

          for (let i = 0; i < count; i++) {
            const theta = (i / count) * Math.PI * 2;
            const px = Math.cos(theta) * speedBase * 0.85;
            const py = Math.sin(theta) * speedBase * 0.85;
            const ry = py * cosX;
            const fx = px * cosZ - ry * sinZ;
            const fy = px * sinZ + ry * cosZ;
            addParticleSafe(new Particle(x, y, fx, fy, palette[0], {
              gravity: 54,
              drag: 0.982,
              maxLife: 1.8 + Math.random() * 0.4,
              trailLen: 6,
              size: 2.0
            }));
          }
          const innerCount = Math.round(70 * pScale);
          for (let i = 0; i < innerCount; i++) {
            const theta = (i / innerCount) * Math.PI * 2;
            const px = Math.cos(theta) * speedBase * 0.45;
            const py = Math.sin(theta) * speedBase * 0.45;
            const ry = py * cosX;
            const fx = px * cosZ - ry * sinZ;
            const fy = px * sinZ + ry * cosZ;
            addParticleSafe(new Particle(x, y, fx, fy, palette[1], {
              gravity: 54,
              drag: 0.982,
              maxLife: 1.6 + Math.random() * 0.4,
              trailLen: 5,
              size: 1.7
            }));
          }
        } else if (type === 'cascading') {
          const outerCount = Math.round(280 * pScale);
          for (let i = 0; i < outerCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.65 + Math.random() * 0.65);
            const col = palette[i % 3];
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, col, {
              gravity: 88,
              drag: 0.98,
              maxLife: 2.5 + Math.random() * 1.1,
              trailLen: 12,
              size: 1.7 + Math.random() * 1.1,
              twinkle: true,
              crackle: Math.random() > 0.5
            }));
          }
          const cascadeCount = Math.round(110 * pScale);
          for (let i = 0; i < cascadeCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedBase * (0.15 + Math.random() * 0.38);
            addParticleSafe(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 20, palette[3], {
              gravity: 125,
              drag: 0.974,
              maxLife: 3.1 + Math.random() * 1.0,
              trailLen: 9,
              size: 1.5,
              twinkle: true
            }));
          }
        }
      }

      function launchFirework(targetX = null, targetY = null, type = null, scale = null) {
        const marginX = state.width * 0.14;
        const tx = targetX ?? (marginX + Math.random() * (state.width - marginX * 2));
        const minSkyY = state.height * 0.12;
        const maxSkyY = state.horizonY - Math.max(60, state.height * 0.18);
        const ty = targetY ?? (minSkyY + Math.random() * Math.max(40, maxSkyY - minSkyY));
        const sc = scale ?? (0.85 + Math.random() * 0.35);

        rockets.push(new Rocket(tx, ty, type, sc));
      }

      function launchMayaAndHeartPair() {
        const leftX = state.width * (state.isPortrait ? 0.42 : 0.38);
        const rightX = state.width * (state.isPortrait ? 0.68 : 0.65);
        const yMaya = state.height * (state.isPortrait ? 0.21 : 0.23);
        const yHeart = state.height * (state.isPortrait ? 0.15 : 0.20);

        launchFirework(leftX, yMaya, 'text_maya', 1.05);
        setTimeout(() => {
          if (!document.hidden) launchFirework(rightX, yHeart, 'heart', 1.05);
        }, 320);
      }

      function launchFinaleSalvo() {
        const types = ['golden_chrysanthemum', 'heart', 'willow'];
        const count = state.isMobile ? 2 : 3;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            if (document.hidden) return;
            const slotX = state.width * (0.22 + (i / (count - 1 || 1)) * 0.56);
            const slotY = state.height * (0.16 + Math.random() * 0.12);
            launchFirework(slotX, slotY, types[i % types.length], 1.08);
          }, i * 320);
        }

        // Kembang api terakhir dalam finale salvo: tulisan "I LOVE YOU"
        setTimeout(() => {
          if (!document.hidden) {
            launchFirework(state.width * 0.5, state.height * 0.22, 'text_iloveyou', 1.15);
          }
        }, count * 320 + 950);
      }

      /* =========================================================================
       * 5. RENDERING: LAYER 1 (PIXEL SKY, STARS, MOON, CLOUDS, OCEAN BASE)
       * ========================================================================= */
      function renderPixelBackground(t) {
        const w = state.gridW;
        const h = state.gridH;
        const horizon = state.horizonRow;
        const shore = state.shoreRow;
        const ctx = bgOffCtx;

        const skyBands = [
          { stop: 0.00, color: '#050816' },
          { stop: 0.25, color: '#080e23' },
          { stop: 0.52, color: '#0d1733' },
          { stop: 0.78, color: '#132245' },
          { stop: 1.00, color: '#192d54' }
        ];
        for (let y = 0; y < horizon; y++) {
          const p = y / horizon;
          let col = skyBands[0].color;
          for (let b = 0; b < skyBands.length - 1; b++) {
            if (p >= skyBands[b].stop && p <= skyBands[b + 1].stop) {
              const localP = (p - skyBands[b].stop) / (skyBands[b + 1].stop - skyBands[b].stop);
              col = (localP > 0.82 && (y % 2 === 0)) ? skyBands[b + 1].color : skyBands[b].color;
              break;
            }
          }
          ctx.fillStyle = col;
          ctx.fillRect(0, y, w, 1);
        }

        if (state.ambientFlash.intensity > 0.01) {
          const fxX = Math.floor(state.ambientFlash.x * w);
          const rad = Math.floor(w * 0.55);
          const { r, g, b, intensity } = state.ambientFlash;
          const grad = ctx.createRadialGradient(fxX, Math.floor(horizon * 0.45), 2, fxX, Math.floor(horizon * 0.45), rad);
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(intensity * 0.22).toFixed(3)})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, horizon);
        }

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
          const a = s.baseAlpha * (0.35 + 0.65 * twinkle);
          ctx.globalAlpha = a;
          ctx.fillStyle = s.color;
          ctx.fillRect(s.x, s.y, 1, 1);
          if (s.cross && twinkle > 0.78) {
            ctx.globalAlpha = a * 0.45;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          }
        }
        ctx.globalAlpha = 1;

        const moonX = Math.floor(w * (state.isPortrait ? 0.78 : 0.76));
        const moonY = Math.floor(horizon * 0.28);
        const moonR = Math.max(5, Math.min(10, Math.floor(Math.min(w, h) * 0.042)));

        for (let dy = -moonR * 2.6; dy <= moonR * 2.6; dy++) {
          for (let dx = -moonR * 2.6; dx <= moonR * 2.6; dx++) {
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist <= moonR * 2.5 && dist > moonR) {
              const haloAlpha = Math.pow(1 - (dist - moonR) / (moonR * 1.5), 2) * 0.22;
              ctx.fillStyle = `rgba(180, 206, 255, ${haloAlpha.toFixed(3)})`;
              ctx.fillRect(Math.floor(moonX + dx), Math.floor(moonY + dy), 1, 1);
            }
          }
        }

        for (let dy = -moonR; dy <= moonR; dy++) {
          for (let dx = -moonR; dx <= moonR; dx++) {
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist <= moonR + 0.3) {
              const crater = ((dx + 2) * (dx + 2) + (dy - 1) * (dy - 1) < 3.2) ||
                             ((dx - 2) * (dx - 2) + (dy + 2) * (dy + 2) < 2.2);
              if (dist > moonR - 0.8) {
                ctx.fillStyle = '#e8dfc2';
              } else if (crater) {
                ctx.fillStyle = '#ddd1ae';
              } else {
                ctx.fillStyle = '#fff6dc';
              }
              ctx.fillRect(moonX + dx, moonY + dy, 1, 1);
            }
          }
        }

        for (let i = 0; i < clouds.length; i++) {
          const c = clouds[i];
          const cx = Math.floor(c.x);
          const cy = c.y;
          for (let row = 0; row < c.h; row++) {
            const rowFrac = row / c.h;
            const inset = Math.floor(Math.abs(rowFrac - 0.55) * c.w * 0.45);
            const span = Math.max(4, c.w - inset * 2);
            const startX = cx + inset;
            for (let col = 0; col < span; col++) {
              const px = (startX + col + w * 2) % w;
              const bump = Math.sin((col + c.seed) * 0.42) > -0.35;
              if (row === 0 && !bump) continue;
              const topRim = row <= 1;
              ctx.fillStyle = topRim ? 'rgba(84, 108, 152, 0.34)' : 'rgba(30, 44, 78, 0.42)';
              ctx.fillRect(px, cy + row, 1, 1);
            }
          }
        }

        const oceanH = shore - horizon;
        for (let y = horizon; y < shore; y++) {
          const depthP = (y - horizon) / Math.max(1, oceanH);
          let col = '#0b162c';
          if (depthP > 0.72) col = '#132a4c';
          else if (depthP > 0.42) col = '#102240';
          else if (depthP > 0.16) col = '#0d1b35';
          ctx.fillStyle = col;
          ctx.fillRect(0, y, w, 1);
        }

        ctx.fillStyle = '#253f69';
        ctx.fillRect(0, horizon, w, 1);

        for (let y = horizon + 1; y < shore; y++) {
          const depthP = (y - horizon) / Math.max(1, oceanH);
          const waveSpeed = 0.65 + depthP * 0.75;
          const wavePhase = y * 0.55 - t * waveSpeed;

          if (Math.sin(wavePhase) > 0.68) {
            for (let x = 0; x < w; x += 4) {
              const seg = Math.sin(x * 0.18 + t * 0.9 + y);
              if (seg > 0.35) {
                ctx.fillStyle = 'rgba(56, 94, 140, 0.42)';
                ctx.fillRect(x, y, 2, 1);
              }
            }
          }

          const shimmerWidth = Math.floor(3 + depthP * (moonR * 1.4));
          const offset = Math.round(Math.sin(t * 1.8 + y * 0.75) * (1.2 + depthP * 2.2));
          for (let dx = -shimmerWidth; dx <= shimmerWidth; dx++) {
            const waveMask = Math.sin(y * 0.85 - t * 1.7 + dx * 0.35);
            if (waveMask > -0.15) {
              const distNorm = Math.abs(dx) / Math.max(1, shimmerWidth);
              if (Math.random() > distNorm * 0.65) {
                const alpha = (1 - distNorm) * (0.28 + 0.35 * (1 - depthP * 0.4));
                ctx.fillStyle = distNorm < 0.35
                  ? `rgba(255, 244, 212, ${alpha.toFixed(2)})`
                  : `rgba(154, 188, 232, ${alpha.toFixed(2)})`;
                ctx.fillRect(moonX + dx + offset, y, 1, 1);
              }
            }
          }
        }

        ctx.fillStyle = '#1b263b';
        ctx.fillRect(0, shore, w, h - shore);

        bgCtx.imageSmoothingEnabled = false;
        bgCtx.drawImage(bgOff, 0, 0, w * state.px, h * state.px);
      }

      /* =========================================================================
       * 6. RENDERING: LAYER 2 (REALISTIC FIREWORKS + OCEAN REFLECTIONS)
       * ========================================================================= */
      function renderFireworksLayer(dt) {
        const w = state.width;
        const h = state.height;

        fxCtx.save();
        fxCtx.globalCompositeOperation = 'destination-out';
        fxCtx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        fxCtx.fillRect(0, 0, w, h);
        fxCtx.restore();

        for (let i = smokes.length - 1; i >= 0; i--) {
          const sm = smokes[i];
          sm.update(dt);
          if (sm.life >= sm.maxLife) {
            smokes.splice(i, 1);
          } else {
            sm.draw(fxCtx);
          }
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.update(dt);
          if (r.exploded) {
            rockets.splice(i, 1);
          } else {
            r.draw(fxCtx);
          }
        }

        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.rect(0, 0, w, state.horizonY + 6);
        fxCtx.clip();
        fxCtx.globalCompositeOperation = 'lighter';
        fxCtx.lineCap = 'round';

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update(dt);
          if (p.life >= p.maxLife || p.y > state.horizonY + 12) {
            particles.splice(i, 1);
          } else {
            p.draw(fxCtx);
          }
        }
        fxCtx.restore();

        const seaTop = state.horizonY;
        const seaBottom = state.shoreY + 6;
        const seaHeight = Math.max(10, seaBottom - seaTop);

        if (particles.length > 0 || rockets.length > 0) {
          fxCtx.save();
          fxCtx.beginPath();
          fxCtx.rect(0, seaTop, w, seaHeight);
          fxCtx.clip();
          fxCtx.globalCompositeOperation = 'lighter';

          const step = particles.length > 260 ? 3 : (particles.length > 120 ? 2 : 1);
          for (let i = 0; i < particles.length; i += step) {
            const p = particles[i];
            const a = p.alpha;
            if (a < 0.14 || p.y > seaTop) continue;

            const distAbove = seaTop - p.y;
            const refY = seaTop + distAbove * 0.34;
            if (refY > seaBottom) continue;

            const depthFactor = (refY - seaTop) / seaHeight;
            const waveShift = Math.sin(refY * 0.25 - state.time * 3.2 + p.x * 0.04) * (3 + depthFactor * 7);
            const rx = p.x + waveShift;
            const stretchW = p.size * (3.2 + depthFactor * 5.0);
            const stretchH = Math.max(1.5, p.size * 1.15);
            const refAlpha = a * 0.24 * (1 - depthFactor * 0.55);

            fxCtx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${refAlpha.toFixed(3)})`;
            fxCtx.fillRect(rx - stretchW * 0.5, refY, stretchW, stretchH);
          }

          if (state.ambientFlash.intensity > 0.03) {
            const fxX = state.ambientFlash.x * w;
            const { r, g, b, intensity } = state.ambientFlash;
            const colGrad = fxCtx.createRadialGradient(fxX, seaTop + seaHeight * 0.35, 4, fxX, seaTop + seaHeight * 0.35, w * 0.32);
            colGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(intensity * 0.24).toFixed(3)})`);
            colGrad.addColorStop(1, 'rgba(0,0,0,0)');
            fxCtx.fillStyle = colGrad;
            fxCtx.fillRect(0, seaTop, w, seaHeight);
          }

          fxCtx.restore();
        }
      }

      /* =========================================================================
       * 7. RENDERING: LAYER 3 (FOREGROUND PIXEL SHORE, SAND, FIREFLIES, MAYA & CIELL)
       * ========================================================================= */
      function drawPixelSprite(ctx, matrix, offsetX, offsetY, palette, ambientTint = null) {
        for (let row = 0; row < matrix.length; row++) {
          const line = matrix[row];
          for (let col = 0; col < line.length; col++) {
            const ch = line[col];
            if (ch === '.') continue;
            const color = palette[ch];
            if (!color) continue;
            ctx.fillStyle = color;
            ctx.fillRect(offsetX + col, offsetY + row, 1, 1);

            if (ambientTint && ambientTint.intensity > 0.08 && (row === 0 || line[col - 1] === '.' || line[col + 1] === '.')) {
              ctx.fillStyle = `rgba(${ambientTint.r}, ${ambientTint.g}, ${ambientTint.b}, ${(ambientTint.intensity * 0.32).toFixed(2)})`;
              ctx.fillRect(offsetX + col, offsetY + row, 1, 1);
            }
          }
        }
      }

      function renderPixelForeground(t) {
        const w = state.gridW;
        const h = state.gridH;
        const shore = state.shoreRow;
        const ctx = fgOffCtx;

        ctx.clearRect(0, 0, w, h);

        for (let x = 0; x < w; x++) {
          const tide = Math.sin(t * 0.72 + x * 0.045) * 1.4 + Math.cos(t * 0.42 - x * 0.025) * 0.9;
          const curve = Math.sin((x / w) * Math.PI) * 2.5;
          const foamY = Math.round(shore + tide + curve);

          const wetDepth = 4 + Math.round(Math.sin(x * 0.09 + 1.2) * 1.2);
          ctx.fillStyle = '#242937';
          ctx.fillRect(x, foamY + 1, 1, wetDepth);

          if (state.ambientFlash.intensity > 0.05 && ((x + Math.floor(t * 4)) % 3 === 0)) {
            const { r, g, b, intensity } = state.ambientFlash;
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${(intensity * 0.25).toFixed(2)})`;
            ctx.fillRect(x, foamY + 1, 1, 2);
          }

          for (let y = foamY + 1 + wetDepth; y < h; y++) {
            const sandP = (y - shore) / Math.max(1, h - shore);
            let sCol = '#3b3843';
            if (sandP > 0.68) sCol = '#534c54';
            else if (sandP > 0.36) sCol = '#47414b';
            ctx.fillStyle = sCol;
            ctx.fillRect(x, y, 1, 1);
          }

          const foamBreak = Math.sin(x * 0.22 + t * 1.1) > -0.75;
          if (foamBreak) {
            ctx.fillStyle = 'rgba(186, 214, 240, 0.78)';
            ctx.fillRect(x, foamY, 1, 1);
            if (Math.sin(t * 0.72 + x * 0.045) > 0.35) {
              ctx.fillStyle = 'rgba(116, 152, 192, 0.45)';
              ctx.fillRect(x, foamY - 1, 1, 1);
            }
          }
        }

        for (let i = 0; i < sandSpecks.length; i++) {
          const sp = sandSpecks[i];
          ctx.fillStyle = sp.bright ? 'rgba(118, 108, 114, 0.42)' : 'rgba(34, 30, 40, 0.42)';
          ctx.fillRect(sp.x, sp.y, 1, 1);
        }

        if (state.ambientFlash.intensity > 0.02) {
          const fxX = Math.floor(state.ambientFlash.x * w);
          const { r, g, b, intensity } = state.ambientFlash;
          const sandGlow = ctx.createRadialGradient(fxX, shore + 4, 2, fxX, shore + 8, Math.floor(w * 0.45));
          sandGlow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(intensity * 0.16).toFixed(3)})`);
          sandGlow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = sandGlow;
          ctx.fillRect(0, shore, w, h - shore);
        }

        const charW = 32;
        const charH = 20;
        const charX = Math.floor(w / 2 - charW / 2);
        const sandHeight = h - shore;
        const charY = Math.min(h - charH - 6, Math.max(shore + 2, shore + Math.floor(sandHeight * 0.24)));

        const ambientTint = state.ambientFlash.intensity > 0.06 ? state.ambientFlash : null;

        const mayaBreath = Math.sin(t * 1.45) > 0.75 ? 1 : 0;
        const ciellBreath = Math.sin(t * 1.35 + 1.1) > 0.78 ? 1 : 0;

        drawPixelSprite(ctx, BASE_COUPLE_TORSO, charX, charY, CHAR_PALETTE, ambientTint);

        const mayaHead = coupleState.mayaLook === 1 ? MAYA_HEAD_TURN_RIGHT : MAYA_HEAD_FORWARD;
        drawPixelSprite(ctx, mayaHead, charX + 3, charY + mayaBreath, CHAR_PALETTE, ambientTint);

        const windWave = Math.sin(t * 2.2);
        const hairShift = windWave > 0.45 ? 1 : (windWave < -0.55 ? -1 : 0);
        ctx.fillStyle = CHAR_PALETTE['m'];
        ctx.fillRect(charX + 4 + hairShift, charY + 10 + mayaBreath, 1, 2);
        ctx.fillRect(charX + 10 + hairShift, charY + 10 + mayaBreath, 1, 2);
        ctx.fillStyle = CHAR_PALETTE['M'];
        ctx.fillRect(charX + 6 + (hairShift > 0 ? 1 : 0), charY + 9 + mayaBreath, 2, 1);

        const ciellHead = coupleState.ciellLook === 1 ? CIELL_HEAD_TURN_LEFT : CIELL_HEAD_FORWARD;
        drawPixelSprite(ctx, ciellHead, charX + 19, charY + ciellBreath, CHAR_PALETTE, ambientTint);

        const ciellLockShift = Math.sin(t * 2.5 + 0.8) > 0.4 ? 1 : 0;
        ctx.fillStyle = CHAR_PALETTE['l'];
        ctx.fillRect(charX + 22 + ciellLockShift, charY + ciellBreath, 2, 1);

        for (let i = 0; i < fireflies.length; i++) {
          const ff = fireflies[i];
          const glow = 0.2 + 0.8 * Math.max(0, Math.sin(t * ff.speed + ff.phase));
          if (glow > 0.25) {
            ctx.fillStyle = `rgba(245, 255, 165, ${(glow * 0.85).toFixed(2)})`;
            ctx.fillRect(Math.floor(ff.x), Math.floor(ff.y), 1, 1);
            if (glow > 0.72) {
              ctx.fillStyle = `rgba(210, 255, 140, 0.25)`;
              ctx.fillRect(Math.floor(ff.x) - 1, Math.floor(ff.y), 1, 1);
              ctx.fillRect(Math.floor(ff.x) + 1, Math.floor(ff.y), 1, 1);
            }
          }
        }

        fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);
        fgCtx.imageSmoothingEnabled = false;
        fgCtx.drawImage(fgOff, 0, 0, w * state.px, h * state.px);
      }

      /* =========================================================================
       * 8. SIMULATION UPDATE & ADAPTIVE PERFORMANCE
       * ========================================================================= */
      function updateSimulation(dt) {
        state.time += dt;

        if (state.ambientFlash.intensity > 0) {
          state.ambientFlash.intensity = Math.max(0, state.ambientFlash.intensity - dt * 1.35);
        }

        for (let i = 0; i < clouds.length; i++) {
          clouds[i].x += clouds[i].speed * dt;
          if (clouds[i].x > state.gridW + clouds[i].w) {
            clouds[i].x = -clouds[i].w;
          }
        }

        for (let i = 0; i < fireflies.length; i++) {
          const ff = fireflies[i];
          ff.x += ff.vx * dt + Math.sin(state.time + ff.phase) * 0.4 * dt;
          ff.y += ff.vy * dt + Math.cos(state.time * 0.8 + ff.phase) * 0.3 * dt;
          if (ff.x < 2) ff.x = state.gridW - 3;
          if (ff.x > state.gridW - 2) ff.x = 3;
          if (ff.y < state.shoreRow + 1) ff.vy = Math.abs(ff.vy);
          if (ff.y > state.gridH - 4) ff.vy = -Math.abs(ff.vy);
        }

        coupleState.timer -= dt;
        if (coupleState.timer <= 0) {
          if (coupleState.phase === 'forward') {
            coupleState.phase = 'mayaPeek';
            coupleState.mayaLook = 1;
            coupleState.ciellLook = 0;
            coupleState.timer = 1.4 + Math.random() * 1.1;
          } else if (coupleState.phase === 'mayaPeek') {
            coupleState.phase = 'bothLook';
            coupleState.mayaLook = 1;
            coupleState.ciellLook = 1;
            coupleState.timer = 2.0 + Math.random() * 1.4;
          } else if (coupleState.phase === 'bothLook') {
            coupleState.phase = 'ciellPeek';
            coupleState.mayaLook = 0;
            coupleState.ciellLook = 1;
            coupleState.timer = 1.1 + Math.random() * 0.9;
          } else {
            coupleState.phase = 'forward';
            coupleState.mayaLook = 0;
            coupleState.ciellLook = 0;
            coupleState.timer = 4.8 + Math.random() * 4.5;
          }
        }

        // Automatic firework show scheduling
        state.autoFireworkTimer -= dt;
        if (state.autoFireworkTimer <= 0) {
          state.burstCounter++;
          state.specialCooldown--;

          // Kadang-kadang meledak menjadi nama "MAYA" dan bentuk Love
          if (state.specialCooldown <= 0) {
            const roll = Math.random();
            if (roll < 0.36) {
              launchFirework(state.width * (0.35 + Math.random() * 0.3), state.height * 0.22, 'text_maya', 1.05);
            } else if (roll < 0.72) {
              launchFirework(state.width * (0.3 + Math.random() * 0.4), state.height * 0.20, 'heart', 1.08);
            } else {
              launchMayaAndHeartPair();
            }
            state.specialCooldown = 3 + Math.floor(Math.random() * 2);
            state.autoFireworkTimer = 2.6 + Math.random() * 1.5;
          } else {
            const type = FIREWORK_TYPES[Math.floor(Math.random() * FIREWORK_TYPES.length)];
            const isBig = type === 'cascading' || Math.random() > 0.78;
            launchFirework(null, null, type, isBig ? 1.18 : (0.82 + Math.random() * 0.28));

            if (Math.random() > 0.65) {
              setTimeout(() => {
                if (!document.hidden) launchFirework();
              }, 380 + Math.random() * 420);
            }
            state.autoFireworkTimer = 1.6 + Math.random() * 2.2;
          }
        }

        // Grand Finale Salvo yang diakhiri kembang api bertuliskan "I LOVE YOU"
        state.finaleCooldown -= dt;
        if (state.finaleCooldown <= 0) {
          launchFinaleSalvo();
          state.finaleCooldown = 24 + Math.random() * 8;
          state.autoFireworkTimer = 5.4; // Beri jeda sejenak agar tulisan "I LOVE YOU" terlihat jelas
        }
      }

      function monitorPerformance(dt) {
        state.fpsAccumulator += dt;
        state.fpsFrames++;
        if (state.fpsAccumulator >= 2.0) {
          const fps = state.fpsFrames / state.fpsAccumulator;
          if (fps < 36 && state.qualityTier !== 'low') {
            state.qualityTier = 'low';
            state.maxParticles = 650;
            state.particleScale = 0.55;
          } else if (fps < 48 && state.qualityTier === 'high') {
            state.qualityTier = 'medium';
            state.maxParticles = 1100;
            state.particleScale = 0.78;
          }
          state.fpsAccumulator = 0;
          state.fpsFrames = 0;
        }
      }

      /* =========================================================================
       * 9. RESPONSIVE LAYOUT & RESIZE OBSERVER
       * ========================================================================= */
      function computeResponsiveLayout() {
        const w = stage.clientWidth || window.innerWidth;
        const h = stage.clientHeight || window.innerHeight;
        state.width = w;
        state.height = h;
        state.isPortrait = h > w;
        state.isMobile = Math.min(w, h) <= 680;

        const rawDpr = window.devicePixelRatio || 1;
        state.dpr = state.isMobile ? Math.min(rawDpr, 1.5) : Math.min(rawDpr, 2);

        const cores = navigator.hardwareConcurrency || 4;
        if (state.isMobile && cores <= 4) {
          state.qualityTier = 'medium';
          state.maxParticles = 950;
          state.particleScale = 0.72;
        } else {
          state.qualityTier = 'high';
          state.maxParticles = 1750;
          state.particleScale = 1.0;
        }

        if (state.isPortrait) {
          state.px = Math.max(2, Math.min(5, Math.floor(w / 108)));
        } else {
          state.px = Math.max(3, Math.min(6, Math.floor(h / 165)));
        }

        state.gridW = Math.ceil(w / state.px);
        state.gridH = Math.ceil(h / state.px);

        const horizonRatio = state.isPortrait ? 0.56 : 0.54;
        const shoreRatio = state.isPortrait ? 0.74 : 0.75;

        state.horizonRow = Math.floor(state.gridH * horizonRatio);
        state.shoreRow = Math.floor(state.gridH * shoreRatio);
        state.horizonY = state.horizonRow * state.px;
        state.shoreY = state.shoreRow * state.px;

        bgOff.width = state.gridW;
        bgOff.height = state.gridH;
        fgOff.width = state.gridW;
        fgOff.height = state.gridH;

        bgCanvas.width = w;
        bgCanvas.height = h;
        fgCanvas.width = w;
        fgCanvas.height = h;

        fxCanvas.width = Math.floor(w * state.dpr);
        fxCanvas.height = Math.floor(h * state.dpr);
        fxCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        initPixelEnvironment();
      }

      const resizeObserver = new ResizeObserver(() => {
        computeResponsiveLayout();
      });
      resizeObserver.observe(stage);
      window.addEventListener('orientationchange', () => {
        setTimeout(computeResponsiveLayout, 120);
      });

      /* =========================================================================
       * 10. MAIN ANIMATION LOOP & INTERACTION HANDLERS
       * ========================================================================= */
      function loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - state.lastFrame) / 1000));
        state.lastFrame = now;

        if (!document.hidden) {
          updateSimulation(dt);
          renderPixelBackground(state.time);
          renderFireworksLayer(dt);
          renderPixelForeground(state.time);
          monitorPerformance(dt);
        }

        requestAnimationFrame(loop);
      }

      // Click / Tap anywhere on stage to launch extra fireworks
      stage.addEventListener('pointerdown', (e) => {
        const rect = stage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const targetY = y < state.horizonY - 35
          ? Math.max(state.height * 0.10, y)
          : state.height * (0.15 + Math.random() * 0.20);

        // Sesekali klik pengguna juga bisa memunculkan Love atau MAYA
        const r = Math.random();
        let type;
        if (r < 0.16) {
          type = 'heart';
        } else if (r < 0.28) {
          type = 'text_maya';
        } else {
          type = FIREWORK_TYPES[Math.floor(Math.random() * FIREWORK_TYPES.length)];
        }

        launchFirework(x, targetY, type, 1.05 + Math.random() * 0.22);
        tapHint.classList.remove('visible');
      });

      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.audioEnabled = !state.audioEnabled;
        audio.setEnabled(state.audioEnabled);
        musicBtn.classList.toggle('active', state.audioEnabled);
        musicBtnLabel.textContent = state.audioEnabled ? 'Music: ON' : 'Music: OFF';
      });

      volumeSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        const vol = Number(e.target.value) / 100;
        audio.setVolume(vol);
        if (vol > 0 && !state.audioEnabled) {
          state.audioEnabled = true;
          audio.setEnabled(true);
          musicBtn.classList.add('active');
          musicBtnLabel.textContent = 'Music: ON';
        }
      });

      function playIntroSequence() {
        introCurtain.style.transition = 'none';
        introCurtain.classList.remove('fade-out');
        bottomCaption.classList.remove('visible');
        tapHint.classList.remove('visible');

        void introCurtain.offsetWidth;

        introCurtain.style.transition = 'opacity 2.6s cubic-bezier(0.22, 1, 0.36, 1)';
        setTimeout(() => {
          introCurtain.classList.add('fade-out');
        }, 450);

        setTimeout(() => {
          bottomCaption.classList.add('visible');
        }, 1600);

        setTimeout(() => {
          tapHint.classList.add('visible');
          setTimeout(() => tapHint.classList.remove('visible'), 5200);
        }, 2500);

        coupleState.phase = 'forward';
        coupleState.mayaLook = 0;
        coupleState.ciellLook = 0;
        coupleState.timer = 4.2;

        state.specialCooldown = 2;
        state.finaleCooldown = 13.5;

        setTimeout(() => {
          launchFirework(state.width * 0.40, state.height * 0.22, 'golden_chrysanthemum', 1.15);
        }, 900);
        setTimeout(() => {
          launchMayaAndHeartPair();
        }, 2100);
      }

      replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        particles.length = 0;
        rockets.length = 0;
        smokes.length = 0;
        fxCtx.clearRect(0, 0, state.width, state.height);
        playIntroSequence();
      });

      fullscreenBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
          const req = document.documentElement.requestFullscreen ||
                      document.documentElement.webkitRequestFullscreen;
          if (req) req.call(document.documentElement).catch(() => {});
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document).catch(() => {});
        }
      });

      document.addEventListener('fullscreenchange', () => {
        fullscreenBtn.classList.toggle('active', Boolean(document.fullscreenElement));
      });

      function setUiHidden(hidden) {
        state.uiHidden = hidden;
        uiLayer.classList.toggle('ui-hidden', hidden);
        restoreUiBtn.classList.toggle('visible', hidden);
        if (hidden) tapHint.classList.remove('visible');
      }

      hideUiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setUiHidden(true);
      });

      restoreUiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setUiHidden(false);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H' || (e.key === 'Escape' && state.uiHidden)) {
          setUiHidden(!state.uiHidden);
        }
      });

      computeResponsiveLayout();
      playIntroSequence();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
